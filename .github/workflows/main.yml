name: Enterprise Pipeline Framework

on:
  push:
    branches: [ main, release/*, hotfix/* ]
  pull_request:
    branches: [ main ]

env:
  CNP_LOG_LEVEL: TRACE
  CNP_OVERRIDE_COMMON: 'true'
  CX_CREDENTIAL: ${{ secrets.CHECKMARX_CREDENTIALS }}
  SONAR_CREDENTIAL_ID: ${{ secrets.SONAR_TOKEN }}
  CNP_DEFAULT_JAVA_IMAGE: 'openjdk:11'
  ARTIFACTORY_ROOT_URL: https://cigna.jfrog.io/artifactory

jobs:
  compile:
    name: Compile Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      
      - name: Compile
        run: mvn -q -B compile -DskipTests
      
      - name: Upload workspace
        uses: actions/upload-artifact@v3
        with:
          name: workspace
          path: |
            .
            !.git
            !target
          retention-days: 1

  precheck-pom-version:
    name: Precheck POM Version
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      
      - name: Run Precheck
        env:
          GIT_URL: ${{ github.event.repository.html_url }}
          GIT_COMMIT: ${{ github.sha }}
          GIT_USER: ${{ github.actor }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./Tag-and-Release-CI.sh precheck

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: workspace
          path: .
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      
      - name: Run Tests
        run: mvn -B verify
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7
      
      - name: Upload JaCoCo Report
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v3
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  quality-scans:
    name: Quality Scans
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: workspace
          path: .
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      
      - name: SonarQube Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=enterprise-pipeline-framework \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
      
      - name: Checkmarx Scan
        uses: checkmarx/ast-github-action@v2
        with:
          project_name: enterprise-pipeline-framework
          cx_tenant: ${{ secrets.CHECKMARX_TENANT }}
          cx_client_id: ${{ secrets.CHECKMARX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CHECKMARX_CLIENT_SECRET }}
          additional_params: --threshold "HIGH=0" --exclude-folders "test,target"

  tag-and-release:
    name: Tag and Release
    runs-on: ubuntu-latest
    needs: [tests, quality-scans]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: workspace
          path: .
      
      - name: Set up Git
        run: |
          git config user.email "DevOpsSystems@Cigna.com"
          git config user.name "DevOpsSystems"
      
      - name: Tag and Release
        env:
          GIT_URL: ${{ github.event.repository.html_url }}
          GIT_COMMIT: ${{ github.sha }}
          GIT_USER: ${{ github.actor }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./Tag-and-Release-CI.sh release