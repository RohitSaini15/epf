title: EPF

# File: _config.yml
# Purpose: This file configures GitHub Pages for EPF
#
# Adapted from:
# https://github.sys.cigna.com/cigna/Conduit/blob/master/_config.yml
# https://nicolas-van.github.io/easy-markdown-to-github-pages/
#
# The GitHub Pages will show up here:
# https://pages.github.sys.cigna.com/cigna/enterprise-pipeline-framework/
#
#-------------------------------------------------------------------------------
email: DevOpsSystems@Cigna.com
description: Documentation supporting the EPF - Enterprise Pipeline Framework.
url: "https://pages.github.sys.cigna.com"
# logo: "./docs/images/epf.jpg"  # Replace with a better logo if you have one!

# Build settings
remote_theme: just-the-docs/just-the-docs@v0.3.3
search_enabled: true
color_scheme: "light"
plugins:
  - jekyll-relative-links
  - jekyll-feed
  - jekyll-remote-theme
  - jemoji

relative_links:
  enabled: true
  collections: true

include:
  - .docs/using-epf/configuration.md

# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
exclude:
  - /resources
  - /src
  - /test
  - /vars
  - sonar-project.properties

# Enable or disable the site search
# Supports true (default) or false
search:
  # Split pages into sections that can be searched individually
  # Supports 1 - 6, default: 2
  heading_level: 2
  # Maximum amount of previews per search result
  # Default: 3
  previews: 2
  # Maximum amount of words to display before a matched word in the preview
  # Default: 5
  preview_words_before: 3
  # Maximum amount of words to display after a matched word in the preview
  # Default: 10
  preview_words_after: 3
  # Set the search token separator
  # Default: /[\s\-/]+/
  # Example: enable support for hyphenated search words
  tokenizer_separator: /[\s/]+/
  # Display the relative url in search results
  # Supports true (default) or false
  rel_url: true
  # Enable or disable the search button that appears in the bottom right corner of every page
  # Supports true or false (default)
  button: true

# Enable or disable heading anchors
heading_anchors: true

# Aux links for the upper right navigation
aux_links:
  "EPF on GitHub":
    - "https://github.sys.cigna.com/cigna/enterprise-pipeline-framework"

# Makes Aux links open in a new tab. Default is false
aux_links_new_tab: true

# Footer "Edit this page on GitHub" link text
gh_edit_link: true # show or hide edit this page link
gh_edit_link_text: "Edit this page on GitHub."
gh_edit_repository: "https://github.sys.cigna.com/cigna/enterprise-pipeline-framework" # the github URL for your repo
gh_edit_branch: "gh-pages" # the branch that your docs is served from, change to master when ready!
gh_edit_source: docs # the source that your files originate from
gh_edit_view_mode: "tree" # "tree" or "edit" if you want the user to jump into the editor immediately

# Footer last edited timestamp
last_edit_timestamp: true # show or hide edit time - page must have `last_modified_date` defined in the frontmatter
last_edit_time_format: "%b %e %Y at %I:%M %p" # uses ruby's time format: https://ruby-doc.org/stdlib-2.7.0/libdoc/time/rdoc/Time.html

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Changing the markdown renderer to address how tables are rendered, as advised here:
# https://github.com/orgs/community/discussions/23945
# markdown: GFM
# The problem with that is the hyperlinks don't work


kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false
